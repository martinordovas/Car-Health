<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="utf-8" />
    <title>Car Health · Tu garaje, en orden</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Controla repostajes, mantenimiento, consumo real y gastos de tu coche desde un solo lugar." />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#f2f4ef" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Car Health" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" href="fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ch-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          var locale = localStorage.getItem('ch-locale');
          if (locale !== 'en' && locale !== 'es') {
            var browserLanguage = (
              (navigator.languages && navigator.languages[0]) ||
              navigator.language ||
              ''
            ).toLowerCase();
            locale = browserLanguage.indexOf('en') === 0 ? 'en' : 'es';
          }
          document.documentElement.lang = locale;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Activa JavaScript para usar Car Health. · Enable JavaScript to use Car Health.</noscript>
  </body>
</html>
